version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: zelda_postgres
    restart: always
    environment:
      POSTGRES_USER: zelda
      POSTGRES_PASSWORD: zelda_pass
      POSTGRES_DB: zelda_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: zelda_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ../backend
    container_name: zelda_backend
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - ../backend/.env
    depends_on:
      - postgres
      - redis

  frontend:
    build: ../frontend
    container_name: zelda_frontend
    restart: always
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  postgres_data:
